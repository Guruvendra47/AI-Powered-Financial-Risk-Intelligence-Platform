version: '3.8'

services:

  # =========================================================================
  # 1. METADATA DATABASE (Postgres Backend)
  # =========================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. AIRFLOW DATABASE INITIALIZER
  # =========================================================================
  airflow-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: airflow db migrate

  # =========================================================================
  # 3. AIRFLOW WEB INTERFACE & API SERVER
  # =========================================================================
  airflow-api-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: airflow-api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    # Automatically pulls ALL variables (Snowflake & OpenAI) from project root .env
    env_file:
      - ../.env
    volumes:
      - ../:/opt/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    environment:
      # Core Airflow Settings
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API_AUTH__JWT_SECRET: "my-secret-key"
      AIRFLOW_SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      PYTHONPATH: /opt/project
    command: airflow api-server

  # =========================================================================
  # 4. AIRFLOW JOB SCHEDULER & RUNTIME EXECUTOR
  # =========================================================================
  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # Automatically pulls ALL variables (Snowflake & OpenAI) from project root .env
    env_file:
      - ../.env
    volumes:
      - ../:/opt/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    environment:
      # Core Airflow Settings
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API_AUTH__JWT_SECRET: "my-secret-key"
      AIRFLOW_SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      PYTHONPATH: /opt/project
    command: airflow scheduler
