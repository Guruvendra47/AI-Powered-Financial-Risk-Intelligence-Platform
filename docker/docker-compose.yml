version: '3.8'

services:

  # =========================================================================
  # 1. METADATA DATABASE (Postgres)
  # =========================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432" # Exposes Postgres locally so you can inspect the backend if needed
    healthcheck:
      # Ensures dependent services don't attempt connections until Postgres is fully accepting traffic
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. AIRFLOW DATABASE INITIALIZER & MIGRATOR
  # =========================================================================
  airflow-init:
    build:
      context: ..              # Looks at the parent directory to find the project root
      dockerfile: docker/Dockerfile # Uses your custom Dockerfile with OpenAI, LangChain, and dbt
    container_name: airflow-init
    depends_on:
      - postgres
    environment:
      # Connection string instructing Airflow how to speak to our Postgres container
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: >
      airflow db migrate # Airflow 3 upgrade command that safely builds or patches database schemas

  # =========================================================================
  # 3. AIRFLOW WEB INTERFACE / API SERVER (Airflow 3 Architecture)
  # =========================================================================
  airflow-api-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile # CRITICAL: Must build the exact same custom image to read your DAG code imports
    container_name: airflow-api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully # Only fires up once the database migrations finish running
    ports:
      - "8080:8080" # Maps port 8080 of the container to http://localhost:8080 on your host machine
    volumes:
      - ../:/opt/project                        # Mounts the whole project root so code changes sync instantly
      - ./airflow/dags:/opt/airflow/dags        # Dedicated mount for Airflow to process DAG definitions
      - ./airflow/logs:/opt/airflow/logs        # Persists execution logs locally on your machine
      - ./airflow/plugins:/opt/airflow/plugins  # Mount for custom Airflow plugins or operators
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"     # Disables vanilla example DAGs to keep your UI perfectly clean
      AIRFLOW__API_AUTH__JWT_SECRET: "my-secret-key" 
      AIRFLOW_SIMPLE_AUTH_MANAGER_USERS: "admin:admin" # Default UI login credentials (User: admin | Pass: admin)
      PYTHONPATH: "/opt/project"                # CRITICAL: Forces Python to recognize the 'src' directory for imports
    command: >
      airflow api-server # Launches the modern Airflow 3 web interface and control plane daemon

  # =========================================================================
  # 4. AIRFLOW JOB SCHEDULER
  # =========================================================================
  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile # Uses the same custom image containing your dbt and AI environments
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ../:/opt/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API_AUTH__JWT_SECRET: "my-secret-key"
      AIRFLOW_SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      # FIXED: Uses Docker's internal DNS routing network to cleanly send heartbeats to the API server
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      PYTHONPATH: "/opt/project"                # Allows the scheduler daemon to parse "from src.* import ..."
    command: >
      airflow scheduler # Launches the engine responsible for monitoring, triggering, and running tasks
